<script>
(function(){
  var cur='th';
  function setLang(l){
    cur=l;
    document.documentElement.lang=l;
    document.querySelectorAll('[data-th]').forEach(function(el){el.textContent=el.getAttribute('data-'+l)});
    document.querySelectorAll('.lang button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.lang===l)});
    try{localStorage.setItem('lang',l)}catch(e){}
  }
  document.querySelectorAll('.lang button').forEach(function(b){b.addEventListener('click',function(){setLang(b.dataset.lang)})});
  var saved=null;try{saved=localStorage.getItem('lang')}catch(e){}
  setLang(saved==='en'?'en':'th');

  var btn=document.getElementById('copy-email');
  btn.addEventListener('click',function(){
    var t=document.getElementById('email').textContent;
    function done(){btn.textContent=cur==='th'?'คัดลอกแล้ว':'Copied';setTimeout(function(){btn.textContent=btn.getAttribute('data-'+cur)},1600)}
    function fallback(){var r=document.createRange();r.selectNodeContents(document.getElementById('email'));var s=getSelection();s.removeAllRanges();s.addRange(r)}
    if(navigator.clipboard){navigator.clipboard.writeText(t).then(done,fallback)}else fallback();
  });
})();
</script>
<script>
/* Lead source tracking: one anonymous id per browser, source from ?src= link, in-app browser or referrer */
(function(){
  function vid(){
    var k='apst_vid',v=null;
    try{v=localStorage.getItem(k)}catch(e){}
    if(!v){v=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));try{localStorage.setItem(k,v)}catch(e){}}
    return v;
  }
  function source(){
    var q=new URLSearchParams(location.search),p=(q.get('src')||q.get('utm_source')||'').toLowerCase();
    var map={ig:'instagram',instagram:'instagram',fb:'facebook',facebook:'facebook',tt:'tiktok',tiktok:'tiktok',line:'line',yt:'youtube',youtube:'youtube'};
    if(map[p])return map[p];
    if(p)return p.slice(0,32);
    var ua=navigator.userAgent||'';
    if(/Instagram/i.test(ua))return 'instagram';
    if(/FBAN|FBAV|FB_IAB|FBIOS/i.test(ua))return 'facebook';
    if(/musical_ly|BytedanceWebview|TikTok|trill/i.test(ua))return 'tiktok';
    if(/\bLine\//i.test(ua))return 'line';
    var r='';try{r=new URL(document.referrer).hostname}catch(e){}
    if(/instagram/.test(r))return 'instagram';
    if(/facebook|fb\.com|fb\.me/.test(r))return 'facebook';
    if(/tiktok/.test(r))return 'tiktok';
    if(/google\./.test(r))return 'google';
    if(r&&r!==location.hostname)return r.slice(0,32);
    return 'direct';
  }
  var src=source();
  try{sessionStorage.setItem('apst_src',src)}catch(e){}
  function send(type,target){
    var body=JSON.stringify({vid:vid(),src:src,type:type,target:target||''});
    try{
      if(navigator.sendBeacon){navigator.sendBeacon('/api/hit',new Blob([body],{type:'application/json'}));return}
    }catch(e){}
    fetch('/api/hit',{method:'POST',headers:{'Content-Type':'application/json'},body:body,keepalive:true}).catch(function(){});
  }
  send('view');
  /* Umami gets the same visitor id, so it can tell returning visitors apart */
  function umami(fn){
    try{
      if(window.umami)return fn(window.umami);
      var s=document.querySelector('script[src*="umami"]');
      if(s)s.addEventListener('load',function(){if(window.umami)fn(window.umami)});
    }catch(e){}
  }
  umami(function(u){u.identify(vid(),{src:src});u.track()});
  document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('a.row,a.cta,#copy-email');
    if(!a)return;
    var t=a.id==='copy-email'?'email-copy':(a.querySelector('.name')?a.querySelector('.name').textContent:a.textContent).trim().toLowerCase();
    if(a.classList.contains('cta'))t='cta:'+(a.getAttribute('href')||'').replace(/^https?:\/\/(www\.)?/,'').split(/[/?]/)[0];
    send('click',t.slice(0,48));
    umami(function(u){u.track('click',{target:t.slice(0,48),src:src})});
  });
})();
</script>
